<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalCo | Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-main: #050507;
            --bg-panel: #0b0b0e;
            --border-subtle: #1e1e26;
            --brand-accent: #8b55d6;
        }

        body {
            background-color: var(--bg-main);
            color: #e4e4e7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .signal-standby {
            background-color: #120d02 !important;
            box-shadow: inset 0 0 90px rgba(245, 158, 11, 0.18);
            outline: 2px solid #f59e0b;
            outline-offset: -2px;
        }
        .signal-go {
            background-color: #02130a !important;
            box-shadow: inset 0 0 110px rgba(16, 185, 129, 0.22);
            outline: 2px solid #10b981;
            outline-offset: -2px;
        }

        @keyframes breathe-red {
            0%, 100% { background-color: var(--bg-main); box-shadow: inset 0 0 0px rgba(220, 38, 38, 0); }
            50% { background-color: #160407; box-shadow: inset 0 0 130px rgba(220, 38, 38, 0.35); }
        }
        .breathe-active { animation: breathe-red 4.5s ease-in-out infinite; }

        .message-urgent {
            background-color: rgba(127, 29, 29, 0.24) !important;
            border-color: rgba(239, 68, 68, 0.6) !important;
            color: #fecaca !important;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #272730; border-radius: 2px; }
    </style>
</head>
<body id="app"
      :class="{
          'breathe-active': isBreathing && masterSignal === 'clear',
          'signal-standby': masterSignal === 'standby',
          'signal-go': masterSignal === 'go'
      }"
      class="h-screen flex flex-col overflow-hidden transition-colors duration-300">

    <!-- FREE TIER WATERMARK -->
    <div v-if="tier !== 'pro'" class="fixed inset-0 pointer-events-none z-[9999] overflow-hidden flex items-center justify-center opacity-[0.025]">
        <div class="transform -rotate-45 text-[9vw] font-black tracking-widest text-white whitespace-nowrap select-none">
            SIGNALCO LITE
        </div>
    </div>

    <!-- HEADER -->
    <header class="px-6 py-3.5 border-b flex justify-between items-center z-20 shrink-0"
            style="background-color: var(--bg-panel); border-color: var(--border-subtle);">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
            <h1 class="text-lg font-extrabold tracking-wider uppercase" style="color: var(--brand-accent);">
                {{ myName }}
            </h1>
        </div>

        <div class="flex items-center gap-3">
            <div v-if="masterSignal === 'standby'"
                 class="px-3.5 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500 text-xs font-bold animate-pulse tracking-widest uppercase">
                Standby
            </div>
            <div v-if="masterSignal === 'go'"
                 class="px-3.5 py-1 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500 text-xs font-bold tracking-widest uppercase">
                Show Go
            </div>

            <div class="flex items-center gap-3 text-xs font-mono text-zinc-400 bg-black px-3.5 py-1.5 rounded border border-zinc-800">
                <span>ID: {{ terminalId }}</span>
                <span class="text-zinc-700">|</span>
                <span class="text-zinc-200">{{ clock }}</span>
            </div>
        </div>
    </header>

    <!-- PINNED BANNER -->
    <div v-if="pinnedMessage"
         class="bg-purple-950/40 border-b border-purple-500/50 text-purple-200 px-6 py-2.5 text-sm font-medium text-center z-20 shrink-0">
        📌 <strong>Pinned:</strong> {{ pinnedMessage }}
    </div>

    <!-- CHAT FEED -->
    <main class="flex-1 overflow-y-auto p-6 relative z-10" id="chatContainer">
        <div class="max-w-4xl mx-auto space-y-4">
            <div v-for="msg in messages" :key="msg.id"
                 class="flex flex-col max-w-[85%]"
                 :class="msg.sender === myName ? 'ml-auto items-end' : 'items-start'">

                <!-- SENDER & TIME -->
                <div class="flex items-center gap-2 mb-1" :class="msg.sender === myName ? 'flex-row-reverse' : ''">
                    <span class="text-[11px] font-semibold"
                          :class="msg.sender === myName ? 'text-blue-400' : (msg.sender === 'MASTER CONTROL' ? 'text-purple-400 font-bold' : 'text-zinc-400')">
                        {{ msg.sender }}
                    </span>
                    <span class="text-[10px] font-mono text-zinc-600">
                        {{ formatTime(msg.timestamp) }}
                    </span>
                    <span v-if="msg.urgent"
                          class="text-[9px] uppercase font-bold tracking-widest text-red-400 bg-red-950/70 px-1.5 py-0.5 rounded border border-red-800">
                        Priority
                    </span>
                </div>

                <!-- MESSAGE BUBBLE + MESSAGE ACKNOWLEDGED BUTTON -->
                <div class="px-4 py-3 rounded-lg border text-sm leading-relaxed flex flex-wrap items-center justify-between gap-4"
                     :class="[
                         msg.urgent ? 'message-urgent' :
                         (msg.sender === myName
                             ? 'bg-blue-950/20 border-blue-900/60 text-blue-100 rounded-tr-none'
                             : 'bg-[#0e0e13] border-zinc-800/90 text-zinc-200 rounded-tl-none')
                     ]">
                    <span class="break-words">{{ msg.text }}</span>

                    <button v-if="msg.sender !== myName"
                            @click="acknowledgeMessage(msg)"
                            :disabled="isAckedByMe(msg)"
                            :class="isAckedByMe(msg)
                                ? 'bg-emerald-950/60 border-emerald-700/60 text-emerald-300 cursor-default'
                                : 'bg-zinc-800 hover:bg-zinc-700 text-white border-zinc-600 cursor-pointer active:scale-95'"
                            class="shrink-0 text-xs font-semibold px-3 py-1.5 rounded border transition-all">
                        <span v-if="isAckedByMe(msg)">✓ Message acknowledged</span>
                        <span v-else>Message acknowledged</span>
                    </button>
                </div>

                <!-- SHARED ACKNOWLEDGED RECEIPTS -->
                <div v-if="getAckList(msg).length > 0"
                     class="mt-1.5 flex flex-wrap items-center gap-1.5"
                     :class="msg.sender === myName ? 'justify-end' : 'justify-start'">
                    <span v-for="ack in getAckList(msg)" :key="ack.id"
                          class="text-[11px] bg-emerald-950/40 border border-emerald-800/50 text-emerald-300 px-2 py-0.5 rounded">
                        ✓ Message acknowledged ({{ ack.name }})
                    </span>
                </div>
            </div>

            <div v-if="messages.length === 0" class="text-center text-zinc-600 mt-20 text-xs uppercase tracking-widest">
                No messages yet
            </div>
        </div>
    </main>

    <!-- CHAT INPUT -->
    <footer class="border-t p-4 z-20 shrink-0" style="background-color: var(--bg-panel); border-color: var(--border-subtle);">
        <div class="max-w-4xl mx-auto flex flex-col gap-2">
            <label class="flex items-center gap-2 self-end text-xs cursor-pointer select-none"
                   :class="isLocked ? 'opacity-40 cursor-not-allowed text-zinc-600' : 'text-zinc-400 hover:text-red-400'">
                <input type="checkbox" v-model="isUrgent" :disabled="isLocked" class="accent-red-600 w-3.5 h-3.5">
                <span class="uppercase tracking-wider text-[11px]">Flag Priority</span>
            </label>

            <div class="flex gap-2.5">
                <input type="text" v-model="draftMessage" @keyup.enter="sendMessage" :disabled="isLocked"
                       :placeholder="isLocked ? 'Chat locked by Master Control...' : 'Send a message...'"
                       class="flex-1 bg-[#070709] border border-zinc-800 rounded px-4 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                <button @click="sendMessage" :disabled="isLocked"
                        :class="isLocked
                            ? 'bg-zinc-900 border border-zinc-800 text-zinc-600 cursor-not-allowed'
                            : (isUrgent ? 'bg-red-600 hover:bg-red-500 text-white' : 'bg-zinc-100 hover:bg-white text-black')"
                        class="font-bold px-6 py-2.5 rounded uppercase tracking-wider text-xs transition-all active:scale-95">
                    Send
                </button>
            </div>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDk7ynP52uYc29OL1Swl64tt0aTOTHaE9Y",
            authDomain: "signalco-94890.firebaseapp.com",
            databaseURL: "https://signalco-94890-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "signalco-94890",
            storageBucket: "signalco-94890.firebasestorage.app",
            messagingSenderId: "957105280763",
            appId: "1:957105280763:web:7df0b037c3c51f32ae025e",
            measurementId: "G-WSXF0KGPZ2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const firestore = firebase.firestore();

        const { createApp, ref, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const urlParams = new URLSearchParams(window.location.search);
                const eventId = ref(urlParams.get('event') || 'demo_sandbox');
                const terminalId = ref(urlParams.get('t') || '1');

                const urlProFlag = urlParams.get('pro') === '1' || urlParams.get('tier') === 'pro';
                const localOverride = ref(urlProFlag || localStorage.getItem(`signalco_pro_${eventId.value}`) === 'true');
                const tier = ref(localOverride.value ? 'pro' : 'free');

                const statusPath = `events/${eventId.value}/status`;
                const configPath = `events/${eventId.value}/config`;
                const messagesPath = `events/${eventId.value}/messages`;

                const myName = ref(`Terminal ${terminalId.value}`);
                const isBreathing = ref(false);
                const masterSignal = ref('clear');
                const isLocked = ref(false);
                const pinnedMessage = ref('');
                const clock = ref('00:00:00');

                const draftMessage = ref('');
                const isUrgent = ref(false);
                const messages = ref([]);

                let initialLoad = true;
                let currentRtdbStatus = 'free';
                const masterIsPremium = ref(false);

                const evaluateTier = () => {
                    if (
                        localOverride.value ||
                        currentRtdbStatus === 'pro' ||
                        currentRtdbStatus === 'paid' ||
                        masterIsPremium.value === true
                    ) {
                        tier.value = 'pro';
                    } else {
                        tier.value = 'free';
                    }
                };

                const updateClock = () => {
                    clock.value = new Date().toTimeString().split(' ')[0];
                };

                const formatTime = (ts) => {
                    if (!ts) return '';
                    return new Date(ts).toTimeString().split(' ')[0];
                };

                const isAckedByMe = (msg) => {
                    return !!(msg.acks && msg.acks[terminalId.value]);
                };

                const getAckList = (msg) => {
                    if (!msg.acks) return [];
                    return Object.entries(msg.acks).map(([id, val]) => ({
                        id,
                        name: val.name || `Terminal ${id}`,
                        timestamp: val.timestamp
                    }));
                };

                const acknowledgeMessage = (msg) => {
                    if (!msg.id || isAckedByMe(msg)) return;
                    db.ref(`${messagesPath}/${msg.id}/acks/${terminalId.value}`).set({
                        name: myName.value,
                        timestamp: Date.now()
                    });
                };

                const scrollToBottom = () => {
                    nextTick(() => {
                        const container = document.getElementById('chatContainer');
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                };

                onMounted(() => {
                    updateClock();
                    setInterval(updateClock, 1000);

                    auth.onAuthStateChanged(async (user) => {
                        if (user) {
                            try {
                                const userDoc = await firestore.collection('users').doc(user.uid).get();
                                masterIsPremium.value = !!(userDoc.exists && userDoc.data().status === 'premium');
                            } catch (err) {
                                console.error("Firestore verification failed:", err);
                            }
                        } else {
                            masterIsPremium.value = false;
                        }
                        evaluateTier();
                    });

                    db.ref(statusPath).on('value', snap => {
                        currentRtdbStatus = snap.val();
                        evaluateTier();
                    });

                    db.ref(configPath).on('value', snap => {
                        const data = snap.val();
                        if (data) {
                            if (data.terminals && data.terminals[terminalId.value]) {
                                myName.value = data.terminals[terminalId.value];
                            } else {
                                myName.value = `Terminal ${terminalId.value}`;
                            }

                            isBreathing.value = data.breathe_red || false;
                            masterSignal.value = data.master_signal || 'clear';
                            isLocked.value = data.chat_locked || false;
                            pinnedMessage.value = data.pinned_message || '';
                        }
                    });

                    db.ref(messagesPath).on('value', snap => {
                        const data = snap.val();
                        if (data) {
                            const msgArray = Object.entries(data)
                                .map(([id, val]) => ({ id, ...val }))
                                .sort((a, b) => a.timestamp - b.timestamp);

                            messages.value = msgArray;

                            if (!initialLoad && msgArray.length > 0) {
                                const newestMsg = msgArray[msgArray.length - 1];
                                if (newestMsg.urgent && newestMsg.sender !== myName.value) {
                                    if (navigator.vibrate) navigator.vibrate([200]);
                                }
                            }
                            initialLoad = false;
                            scrollToBottom();
                        } else {
                            messages.value = [];
                        }
                    });
                });

                const sendMessage = () => {
                    if (!draftMessage.value.trim() || isLocked.value) return;

                    db.ref(messagesPath).push({
                        sender: myName.value,
                        text: draftMessage.value.trim(),
                        timestamp: Date.now(),
                        urgent: isUrgent.value,
                        acks: {}
                    });

                    draftMessage.value = '';
                    isUrgent.value = false;
                };

                return {
                    eventId, terminalId, tier, myName, isBreathing, masterSignal,
                    draftMessage, isUrgent, messages, sendMessage, isLocked, pinnedMessage,
                    clock, formatTime, isAckedByMe, getAckList, acknowledgeMessage
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
