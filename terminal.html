<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalCo | Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-main: #050507;
            --bg-panel: #0b0b0e;
            --border-subtle: #1e1e26;
            --terminal-accent: #3b82f6;
        }

        body {
            background-color: var(--bg-main);
            color: #e4e4e7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .signal-standby {
            background-color: #120d02 !important;
            box-shadow: inset 0 0 90px rgba(245, 158, 11, 0.18);
            outline: 2px solid #f59e0b;
            outline-offset: -2px;
        }
        .signal-go {
            background-color: #02130a !important;
            box-shadow: inset 0 0 110px rgba(16, 185, 129, 0.22);
            outline: 2px solid #10b981;
            outline-offset: -2px;
        }

        @keyframes breathe-red {
            0%, 100% { background-color: var(--bg-main); box-shadow: inset 0 0 0px rgba(220, 38, 38, 0); }
            50% { background-color: #160407; box-shadow: inset 0 0 130px rgba(220, 38, 38, 0.35); }
        }
        .breathe-active { animation: breathe-red 4.5s ease-in-out infinite; }

        /* Full-screen arrival flash */
        @keyframes screen-flash-anim {
            0%, 100% { box-shadow: inset 0 0 0px transparent; }
            50% { box-shadow: inset 0 0 120px var(--terminal-accent); }
        }
        .screen-flash { animation: screen-flash-anim 0.45s ease-out 2; }

        /* Message Highlight Colours */
        .msg-color-red { background-color: rgba(153, 27, 27, 0.38) !important; border-color: #ef4444 !important; color: #fecaca !important; }
        .msg-color-amber { background-color: rgba(146, 64, 14, 0.38) !important; border-color: #f59e0b !important; color: #fde68a !important; }
        .msg-color-green { background-color: rgba(6, 95, 70, 0.38) !important; border-color: #10b981 !important; color: #a7f3d0 !important; }
        .msg-color-blue { background-color: rgba(30, 58, 138, 0.38) !important; border-color: #3b82f6 !important; color: #bfdbfe !important; }
        .msg-color-purple { background-color: rgba(88, 28, 135, 0.38) !important; border-color: #a855f7 !important; color: #e9d5ff !important; }
        .msg-color-cyan { background-color: rgba(21, 94, 117, 0.38) !important; border-color: #06b6d4 !important; color: #a5f3fc !important; }

        /* Message Movement Animations */
        @keyframes anim-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 255, 255, 0); }
            50% { transform: scale(1.02); box-shadow: 0 0 22px rgba(255, 255, 255, 0.22); }
        }
        @keyframes anim-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes anim-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        @keyframes anim-flash {
            0%, 100% { opacity: 1; filter: brightness(1); }
            50% { opacity: 0.7; filter: brightness(1.5); }
        }

        .move-pulse-once { animation: anim-pulse 1.2s ease-in-out 2; }
        .move-bounce-once { animation: anim-bounce 0.6s ease-in-out 3; }
        .move-shake-once { animation: anim-shake 0.5s ease-in-out 3; }
        .move-flash-once { animation: anim-flash 0.7s ease-in-out 3; }

        .move-pulse-loop { animation: anim-pulse 1.5s ease-in-out infinite; }
        .move-bounce-loop { animation: anim-bounce 0.85s ease-in-out infinite; }
        .move-shake-loop { animation: anim-shake 0.75s ease-in-out infinite; }
        .move-flash-loop { animation: anim-flash 0.85s ease-in-out infinite; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #272730; border-radius: 2px; }
    </style>
</head>
<body id="app"
      :style="{ '--terminal-accent': terminalColor }"
      :class="{
          'breathe-active': isBreathing && masterSignal === 'clear',
          'signal-standby': masterSignal === 'standby',
          'signal-go': masterSignal === 'go',
          'screen-flash': isScreenFlashing
      }"
      class="h-screen flex flex-col overflow-hidden transition-colors duration-300">

    <!-- FREE TIER WATERMARK -->
    <div v-if="tier !== 'pro'" class="fixed inset-0 pointer-events-none z-[9999] overflow-hidden flex items-center justify-center opacity-[0.025]">
        <div class="transform -rotate-45 text-[9vw] font-black tracking-widest text-white whitespace-nowrap select-none">
            SIGNALCO LITE
        </div>
    </div>

    <!-- HEADER -->
    <header class="px-6 py-3.5 border-b flex justify-between items-center z-20 shrink-0"
            :style="{ backgroundColor: 'var(--bg-panel)', borderBottomColor: terminalColor + '50' }">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full"
                  :style="{ backgroundColor: terminalColor, boxShadow: '0 0 8px ' + terminalColor }"></span>
            <h1 class="text-lg font-extrabold tracking-wider uppercase" :style="{ color: terminalColor }">
                {{ myName }}
            </h1>
        </div>

        <div class="flex items-center gap-3">
            <div v-if="masterSignal === 'standby'"
                 class="px-3.5 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500 text-xs font-bold animate-pulse tracking-widest uppercase">
                Base Station Not Active
            </div>
            <div v-if="masterSignal === 'go'"
                 class="px-3.5 py-1 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500 text-xs font-bold tracking-widest uppercase">
                Base Station Active
            </div>

            <div class="flex items-center gap-3 text-xs font-mono text-zinc-400 bg-black px-3.5 py-1.5 rounded border border-zinc-800">
                <span>ID: {{ terminalId }}</span>
                <span class="text-zinc-700">|</span>
                <span class="text-zinc-200">{{ clock }}</span>
            </div>
        </div>
    </header>

    <!-- PINNED BANNER -->
    <div v-if="pinnedMessage"
         class="bg-purple-950/40 border-b border-purple-500/50 text-purple-200 px-6 py-2.5 text-sm font-medium text-center z-20 shrink-0">
        📌 <strong>Pinned:</strong> {{ pinnedMessage }}
    </div>

    <!-- CHAT FEED -->
    <main class="flex-1 overflow-y-auto p-6 relative z-10" id="chatContainer">
        <div class="max-w-4xl mx-auto space-y-5">
            <div v-for="msg in visibleMessages" :key="msg.id"
                 class="flex flex-col max-w-[88%]"
                 :class="isMyMessage(msg) ? 'ml-auto items-end' : 'items-start'">

                <!-- SENDER, DIRECT BADGE & TIME -->
                <div class="flex flex-wrap items-center gap-2 mb-1" :class="isMyMessage(msg) ? 'flex-row-reverse' : ''">
                    <span class="text-[11px] font-bold"
                          :style="isMyMessage(msg) ? { color: terminalColor } : (msg.sender === 'MASTER CONTROL' ? { color: masterColor } : {})"
                          :class="(!isMyMessage(msg) && msg.sender !== 'MASTER CONTROL') ? 'text-zinc-400' : ''">
                        {{ msg.sender }}
                    </span>

                    <span v-if="msg.target && String(msg.target) === String(terminalId)"
                          class="text-[10px] font-semibold bg-purple-950/80 text-purple-300 border border-purple-700/60 px-1.5 py-0.5 rounded">
                        Direct to You
                    </span>

                    <span class="text-[10px] font-mono text-zinc-600">
                        {{ formatTime(msg.timestamp) }}
                    </span>

                    <span v-if="msg.urgent"
                          class="text-[9px] uppercase font-bold tracking-widest text-red-400 bg-red-950/70 px-1.5 py-0.5 rounded border border-red-800">
                        Priority
                    </span>
                </div>

                <!-- MESSAGE BUBBLE + MESSAGE ACKNOWLEDGED BUTTON -->
                <div class="px-4 py-3.5 rounded-lg border leading-relaxed flex flex-wrap items-center justify-between gap-4 transition-all"
                     :style="getCustomBubbleStyle(msg)"
                     :class="[
                         fontSizeClass,
                         getMessageColorClass(msg),
                         getTerminalAnimationClass(msg),
                         isMyMessage(msg) ? 'rounded-tr-none' : 'rounded-tl-none'
                     ]">
                    <span class="break-words font-medium">{{ msg.text }}</span>

                    <button v-if="terminalReadReceipts && !isMyMessage(msg)"
                            @click="acknowledgeMessage(msg)"
                            :disabled="isAckedByMe(msg)"
                            :class="isAckedByMe(msg)
                                ? 'bg-emerald-950/60 border-emerald-700/60 text-emerald-300 cursor-default'
                                : 'bg-zinc-900/90 hover:bg-zinc-800 text-white border-white/30 cursor-pointer active:scale-95 shadow-md'"
                            class="shrink-0 text-xs font-semibold px-3.5 py-2 rounded border transition-all">
                        <span v-if="isAckedByMe(msg)">✓ Message acknowledged</span>
                        <span v-else>Message acknowledged</span>
                    </button>
                </div>

                <!-- SHARED ACKNOWLEDGED RECEIPTS -->
                <div v-if="getAckList(msg).length > 0"
                     class="mt-1.5 flex flex-wrap items-center gap-1.5"
                     :class="isMyMessage(msg) ? 'justify-end' : 'justify-start'">
                    <span v-for="ack in getAckList(msg)" :key="ack.id"
                          class="text-[11px] bg-emerald-950/40 border border-emerald-800/50 text-emerald-300 px-2 py-0.5 rounded">
                        ✓ Message acknowledged ({{ ack.name }})
                    </span>
                </div>
            </div>

            <div v-if="visibleMessages.length === 0" class="text-center text-zinc-600 mt-20 text-xs uppercase tracking-widest">
                No messages yet
            </div>
        </div>
    </main>

    <!-- CHAT INPUT -->
    <footer class="border-t p-4 z-20 shrink-0" style="background-color: var(--bg-panel); border-color: var(--border-subtle);">
        <div class="max-w-4xl mx-auto flex flex-col gap-2">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <!-- Per-Message Highlight Colour Picker -->
                <div class="flex items-center gap-1.5">
                    <span class="text-[11px] text-zinc-400 mr-1">Highlight:</span>
                    <button v-for="mc in messageColorOptions" :key="mc.id"
                            @click="selectedMsgColor = mc.id"
                            :disabled="isLocked"
                            :class="[
                                mc.dotClass,
                                selectedMsgColor === mc.id ? 'ring-2 ring-white scale-110' : 'opacity-60 hover:opacity-100'
                            ]"
                            :title="mc.label"
                            class="w-4 h-4 rounded-full transition-all disabled:opacity-20"></button>
                </div>

                <label class="flex items-center gap-2 text-xs cursor-pointer select-none"
                       :class="isLocked ? 'opacity-40 cursor-not-allowed text-zinc-600' : 'text-zinc-400 hover:text-red-400'">
                    <input type="checkbox" v-model="isUrgent" :disabled="isLocked" class="accent-red-600 w-3.5 h-3.5">
                    <span class="uppercase tracking-wider text-[11px] font-semibold">Flag Priority</span>
                </label>
            </div>

            <div class="flex gap-2.5">
                <input type="text" v-model="draftMessage" @keyup.enter="sendMessage" :disabled="isLocked"
                       :placeholder="isLocked ? 'Chat locked by Master Control...' : 'Send a message...'"
                       class="flex-1 bg-[#070709] border border-zinc-800 rounded px-4 py-2.5 text-sm text-white focus:outline-none transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                <button @click="sendMessage" :disabled="isLocked"
                        :style="(!isLocked && !isUrgent) ? { backgroundColor: terminalColor } : {}"
                        :class="isLocked
                            ? 'bg-zinc-900 border border-zinc-800 text-zinc-600 cursor-not-allowed'
                            : (isUrgent ? 'bg-red-600 hover:bg-red-500 text-white' : 'text-white hover:opacity-90')"
                        class="font-bold px-6 py-2.5 rounded uppercase tracking-wider text-xs transition-all active:scale-95">
                    Send
                </button>
            </div>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDk7ynP52uYc29OL1Swl64tt0aTOTHaE9Y",
            authDomain: "signalco-94890.firebaseapp.com",
            databaseURL: "https://signalco-94890-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "signalco-94890",
            storageBucket: "signalco-94890.firebasestorage.app",
            messagingSenderId: "957105280763",
            appId: "1:957105280763:web:7df0b037c3c51f32ae025e",
            measurementId: "G-WSXF0KGPZ2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const firestore = firebase.firestore();

        const { createApp, ref, computed, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const urlParams = new URLSearchParams(window.location.search);
                const eventId = ref(urlParams.get('event') || 'demo_sandbox');
                const terminalId = ref(urlParams.get('t') || '1');

                const urlProFlag = urlParams.get('pro') === '1' || urlParams.get('tier') === 'pro';
                const localOverride = ref(urlProFlag || localStorage.getItem(`signalco_pro_${eventId.value}`) === 'true');
                const tier = ref(localOverride.value ? 'pro' : 'free');

                const statusPath = `events/${eventId.value}/status`;
                const configPath = `events/${eventId.value}/config`;
                const messagesPath = `events/${eventId.value}/messages`;

                const myName = ref(`Terminal ${terminalId.value}`);
                const isBreathing = ref(false);
                const masterSignal = ref('clear');
                const isLocked = ref(false);
                const pinnedMessage = ref('');
                const clock = ref('00:00:00');

                const masterColor = ref('#8b55d6');
                const terminalColor = ref('#3b82f6');
                const fontSize = ref('md');
                const msgAnimation = ref('pulse');
                const loopUntilAck = ref(true);
                const screenFlashOnMsg = ref(false);
                const soundAlerts = ref(false);
                const terminalReadReceipts = ref(true);
                const isScreenFlashing = ref(false);

                const draftMessage = ref('');
                const isUrgent = ref(false);
                const selectedMsgColor = ref('default');
                const messages = ref([]);

                const messageColorOptions = [
                    { id: 'default', label: 'Station Default', dotClass: 'bg-zinc-500 border border-zinc-300' },
                    { id: 'green', label: 'Green', dotClass: 'bg-emerald-500' },
                    { id: 'amber', label: 'Amber', dotClass: 'bg-amber-500' },
                    { id: 'red', label: 'Red', dotClass: 'bg-red-500' },
                    { id: 'blue', label: 'Blue', dotClass: 'bg-blue-500' },
                    { id: 'purple', label: 'Purple', dotClass: 'bg-purple-500' },
                    { id: 'cyan', label: 'Cyan', dotClass: 'bg-cyan-500' }
                ];

                let initialLoad = true;
                let lastMsgCount = 0;
                let currentRtdbStatus = 'free';
                const masterIsPremium = ref(false);

                // Filter messages so terminal only sees messages to 'all', to its own ID, or sent by itself
                const visibleMessages = computed(() => {
                    return messages.value.filter(msg => {
                        if (!msg.target || msg.target === 'all') return true;
                        if (String(msg.target) === String(terminalId.value)) return true;
                        if (String(msg.senderId) === String(terminalId.value) || msg.sender === myName.value) return true;
                        return false;
                    });
                });

                const fontSizeClass = computed(() => {
                    const map = {
                        sm: 'text-sm',
                        md: 'text-base',
                        lg: 'text-xl font-semibold',
                        xl: 'text-2xl font-bold tracking-wide'
                    };
                    return map[fontSize.value] || 'text-base';
                });

                const isMyMessage = (msg) => {
                    return String(msg.senderId) === String(terminalId.value) || msg.sender === myName.value;
                };

                const getMessageColorClass = (msg) => {
                    if (msg.urgent || msg.color === 'red') return 'msg-color-red';
                    if (msg.color && msg.color !== 'default') return `msg-color-${msg.color}`;
                    return 'bg-[#0e0e13] border-zinc-800 text-zinc-100';
                };

                const getCustomBubbleStyle = (msg) => {
                    if (msg.urgent || (msg.color && msg.color !== 'default')) return {};
                    const accent = isMyMessage(msg) ? terminalColor.value : masterColor.value;
                    return {
                        backgroundColor: accent + '22',
                        borderColor: accent + '66'
                    };
                };

                const getTerminalAnimationClass = (msg) => {
                    const anim = msg.effect || msgAnimation.value || 'none';
                    if (anim === 'none') return '';
                    // Keep moving until acknowledged if enabled and message is incoming
                    if (!isMyMessage(msg) && loopUntilAck.value && !isAckedByMe(msg)) {
                        return `move-${anim}-loop`;
                    }
                    return `move-${anim}-once`;
                };

                const playAlertChime = (urgent = false) => {
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (!AudioCtx) return;
                        const ctx = new AudioCtx();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = urgent ? 'sawtooth' : 'sine';
                        osc.frequency.setValueAtTime(urgent ? 880 : 587.33, ctx.currentTime);
                        osc.frequency.setValueAtTime(urgent ? 1174.66 : 880, ctx.currentTime + 0.12);
                        gain.gain.setValueAtTime(0.15, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.35);
                    } catch (e) {}
                };

                const triggerScreenFlash = () => {
                    isScreenFlashing.value = false;
                    setTimeout(() => {
                        isScreenFlashing.value = true;
                        setTimeout(() => { isScreenFlashing.value = false; }, 1000);
                    }, 20);
                };

                const evaluateTier = () => {
                    if (
                        localOverride.value ||
                        currentRtdbStatus === 'pro' ||
                        currentRtdbStatus === 'paid' ||
                        masterIsPremium.value === true
                    ) {
                        tier.value = 'pro';
                    } else {
                        tier.value = 'free';
                    }
                };

                const updateClock = () => {
                    clock.value = new Date().toTimeString().split(' ')[0];
                };

                const formatTime = (ts) => {
                    if (!ts) return '';
                    return new Date(ts).toTimeString().split(' ')[0];
                };

                const isAckedByMe = (msg) => {
                    return !!(msg.acks && msg.acks[terminalId.value]);
                };

                const getAckList = (msg) => {
                    if (!msg.acks) return [];
                    return Object.entries(msg.acks).map(([id, val]) => ({
                        id,
                        name: val.name || (id === 'master' ? 'MASTER CONTROL' : `Terminal ${id}`),
                        timestamp: val.timestamp
                    }));
                };

                const acknowledgeMessage = (msg) => {
                    if (!msg.id || isAckedByMe(msg)) return;
                    db.ref(`${messagesPath}/${msg.id}/acks/${terminalId.value}`).set({
                        name: myName.value,
                        timestamp: Date.now()
                    });
                };

                const scrollToBottom = () => {
                    nextTick(() => {
                        const container = document.getElementById('chatContainer');
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                };

                onMounted(() => {
                    updateClock();
                    setInterval(updateClock, 1000);

                    auth.onAuthStateChanged(async (user) => {
                        if (user) {
                            try {
                                const userDoc = await firestore.collection('users').doc(user.uid).get();
                                masterIsPremium.value = !!(userDoc.exists && userDoc.data().status === 'premium');
                            } catch (err) {
                                console.error("Firestore verification failed:", err);
                            }
                        } else {
                            masterIsPremium.value = false;
                        }
                        evaluateTier();
                    });

                    db.ref(statusPath).on('value', snap => {
                        currentRtdbStatus = snap.val();
                        evaluateTier();
                    });

                    db.ref(configPath).on('value', snap => {
                        const data = snap.val();
                        if (data) {
                            if (data.terminals && data.terminals[terminalId.value]) {
                                myName.value = data.terminals[terminalId.value];
                            } else {
                                myName.value = `Terminal ${terminalId.value}`;
                            }

                            isBreathing.value = data.breathe_red || false;
                            masterSignal.value = data.master_signal || 'clear';
                            isLocked.value = data.chat_locked || false;
                            pinnedMessage.value = data.pinned_message || '';

                            masterColor.value = data.master_color || '#8b55d6';
                            terminalColor.value = data.terminal_color || '#3b82f6';
                            fontSize.value = data.font_size || 'md';
                            msgAnimation.value = data.msg_animation || 'pulse';
                            loopUntilAck.value = data.loop_until_ack !== undefined ? data.loop_until_ack : true;
                            screenFlashOnMsg.value = data.screen_flash_on_msg || false;
                            soundAlerts.value = data.sound_alerts || false;
                            terminalReadReceipts.value = data.terminal_read_receipts !== undefined ? data.terminal_read_receipts : true;
                        }
                    });

                    db.ref(messagesPath).on('value', snap => {
                        const data = snap.val();
                        if (data) {
                            const msgArray = Object.entries(data)
                                .map(([id, val]) => ({ id, ...val }))
                                .sort((a, b) => a.timestamp - b.timestamp);

                            messages.value = msgArray;

                            const currentVisible = visibleMessages.value;
                            if (!initialLoad && currentVisible.length > lastMsgCount) {
                                const newestMsg = currentVisible[currentVisible.length - 1];
                                if (!isMyMessage(newestMsg)) {
                                    if (screenFlashOnMsg.value || newestMsg.urgent) {
                                        triggerScreenFlash();
                                    }
                                    if (soundAlerts.value) {
                                        playAlertChime(newestMsg.urgent);
                                    }
                                    if (newestMsg.urgent && navigator.vibrate) {
                                        navigator.vibrate([200, 100, 200]);
                                    }
                                }
                            }
                            lastMsgCount = currentVisible.length;
                            initialLoad = false;
                            scrollToBottom();
                        } else {
                            messages.value = [];
                            lastMsgCount = 0;
                        }
                    });
                });

                const sendMessage = () => {
                    if (!draftMessage.value.trim() || isLocked.value) return;

                    db.ref(messagesPath).push({
                        sender: myName.value,
                        senderId: String(terminalId.value),
                        target: 'all',
                        targetName: 'Master Control',
                        text: draftMessage.value.trim(),
                        timestamp: Date.now(),
                        urgent: isUrgent.value,
                        color: selectedMsgColor.value,
                        effect: msgAnimation.value || 'none',
                        acks: {}
                    });

                    draftMessage.value = '';
                    isUrgent.value = false;
                };

                return {
                    eventId, terminalId, tier, myName, isBreathing, masterSignal,
                    masterColor, terminalColor, fontSizeClass, terminalReadReceipts,
                    isScreenFlashing, messageColorOptions, selectedMsgColor,
                    draftMessage, isUrgent, visibleMessages, sendMessage, isLocked, pinnedMessage,
                    clock, formatTime, isMyMessage, isAckedByMe, getAckList, acknowledgeMessage,
                    getMessageColorClass, getCustomBubbleStyle, getTerminalAnimationClass
                };
            }
        }).mount('#app');
    </script>
